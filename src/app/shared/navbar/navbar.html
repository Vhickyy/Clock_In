<header class="bg-champagne-light sticky top-0 z-50">
  <nav class="containerClass flex items-center justify-between py-4 lg:py-5">
    <p appText variant="eyebrow">CLOCK IN GUEST</p>

    <ul class="gap-10 hidden lg:flex">
      @for (l of navLinks; track l.route) {
        <li
          appText
          [routerLink]="l.route"
          routerLinkActive="font-semibold border-b-2 border-[#B08A4E]"
          [routerLinkActiveOptions]="{ exact: !!l.exact }"
        >
          {{ l.label }}
        </li>
      }
    </ul>

    <div class="lg:flex gap-4 hidden">
      <button appButton btnClass="px-8 bg-transparent border border-champagne text-champagne ">
        Log In
      </button>
      <button appButton btnClass="lg:px-8 flex-1">Get Started</button>
    </div>
    <div class="flex gap-2 items-center lg:hidden">
      <button appButton btnClass="p-1 rounded-sm bg-transparent border border-champagne">
        <app-icon name="lock" className="text-xs" />
      </button>
      <button appButton btnClass="p-1 rounded-sm bg-transparent border border-champagne">
        <app-icon name="menu" className="text-xs" />
      </button>
    </div>
  </nav>
</header>
