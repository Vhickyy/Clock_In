<header>
  <nav class="containerClass flex items-center justify-between py-5">
    <p appText variant="eyebrow">CLOCK IN GUEST</p>

    <ul class="flex gap-10">
      @for (l of navLinks; track l.route) {
        <li
          appText
          [routerLink]="l.route"
          routerLinkActive="font-semibold border-b-2 border-[#B08A4E]"
          [routerLinkActiveOptions]="{ exact: !!l.exact }"
        >
          {{ l.label }}
        </li>
      }
    </ul>

    <div class="flex gap-4">
      <button appButton btnClass="px-8 bg-transparent border border-champagne text-champagne">
        Log In
      </button>
      <button appButton btnClass="px-8 flex-1">Get Started</button>
    </div>
  </nav>
</header>
