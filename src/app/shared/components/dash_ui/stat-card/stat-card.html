<article
  class="flex h-full items-center gap-4 rounded-2xl border border-border bg-surface/90 p-5 shadow-sm"
>
  <div class="min-w-0">
    <p variant="cardTitle" appText className="text-text">{{ label() }}</p>
    <p variant="cardValue" appText className="text-text">{{ displayValue() }}</p>
    @if (trend(); as trendText) {
      <div class="flex items-center gap-1 text-green">
        <app-icon name="arrowUp" [size]="12" />
        <!-- <p variant="cardTrend" appText className="text-text">{{ trendText }}</p> -->
      </div>
    }
  </div>
</article>
