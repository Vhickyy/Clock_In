<article
  class="flex h-full items-center gap-4 rounded-2xl border border-border bg-surface/90 p-5 shadow-sm"
>
  <!-- <app-icon-bubble [icon]="icon()" [tone]="tone()" size="lg" /> -->

  <div class="min-w-0">
    <app-text variant="cardLabel" className="text-text" [text]="label()" />
    <app-text variant="cardValue" className="my-1" [text]="displayValue()" />
    @if (trend(); as trendText) {
      <div class="flex items-center gap-1 text-green">
        <app-icon name="arrowUp" [size]="12" />
        <app-text variant="cardTrend" className="text-muted" [text]="trendText" />
      </div>
    }
  </div>
</article>
