<div class="flex">
  <section class="flex-1 flex flex-col gap-8">
    <app-dash-header
      text="Create a new organization"
      subText="Manage your evebts, team memebers and guest list from one place. You can switch between organizations at anytime."
    />

    <section class="p-6 rounded-2xl bg-white border border-border grid gap-6">
      <div>
        <h4 appText variant="subheading" class="font-extrabold">Organization Details</h4>
        <p appText variant="pageSubtitle" className="md:text-sm">
          Tell us about your organization. This helps us set up your workspace.
        </p>
      </div>
      <div class="grid gap-8">
        <div class="grid-cols-2 grid gap-6">
          <app-field label="Organization Name" leftIcon="building">
            <input
              appInput
              placeholder="Organization Name"
              class="w-full outline-none text-text text-sm"
            />
          </app-field>
          <app-field label="Organization Type" leftIcon="building">
            <input
              appInput
              placeholder="Organization Type"
              class="w-full outline-none text-text text-sm"
            />
          </app-field>
        </div>
        <div class="grid-cols-2 grid gap-6">
          <app-field label="Contact Email" leftIcon="building">
            <input
              appInput
              placeholder="Contact Email"
              class="w-full outline-none text-text text-sm"
            />
          </app-field>
          <app-field label="Phone Number" leftIcon="building">
            <input
              appInput
              placeholder="Phone Number"
              class="w-full outline-none text-text text-sm"
            />
          </app-field>
        </div>
        <div class="grid-cols-2 grid gap-6">
          <app-field label="Organization Website(Optional)" leftIcon="building">
            <input
              appInput
              placeholder="Organization Website"
              class="w-full outline-none text-text text-sm"
            />
          </app-field>
          <app-field label="Organization Logo" leftIcon="building">
            <input
              appInput
              placeholder="Organization Logo"
              class="w-full outline-none text-text text-sm"
            />
          </app-field>
        </div>
      </div>
      <button appButton btnClass="mt-6 py-3" [iconProps]="{ name: 'arrowRight' }">
        Workspace Settings
      </button>
    </section>
  </section>

  <div class="border border-border mx-8"></div>
  <section class="w-[25%]">
    <aside class="grid gap-4">
      <h4 appText variant="subheading" class="font-extrabold">Your Organizations</h4>
      <div class="grid gap-4">
        @for (org of [1, 2, 3]; track org) {
          <div
            class="bg-white border-2 border-border p-6 rounded-xl flex justify-between items-center"
          >
            <div class="flex items-center gap-6">
              <div class="bg-champagne-light w-fit p-2 rounded-xl">
                <p appText variant="subheading" className="text-champagne">VC</p>
              </div>
              <div>
                <h5 appText variant="cardTitle">Vicky Platform</h5>
                <p appText variant="pageSubtitle" className="md:text-sm">Event Planning</p>
              </div>
            </div>
          </div>
        }
      </div>
    </aside>
  </section>
</div>
