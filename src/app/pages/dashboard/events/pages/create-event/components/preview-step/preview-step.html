<div class="w-full shrink-0 md:w-44">
  @if (createEventService.coverUrl(); as url) {
    <img
      [src]="url"
      alt="Cover image"
      class="aspect-square w-full rounded-xl border border-border object-cover"
    />
  } @else {
    <div
      class="grid aspect-square w-full place-items-center rounded-xl border border-border bg-champagne-light text-champagne-dark"
    >
      <app-icon name="calendar" [size]="36" />
    </div>
  }
</div>

<div class="flex min-w-0 flex-1 flex-col gap-6">
  @for (group of groups(); track group.title) {
    <section>
      <header class="flex items-center justify-between">
        <!-- <app-text variant="cardTitle" [text]="group.title" /> -->
        <button
          type="button"
          class="font-body text-xs font-semibold text-champagne-dark underline-offset-2 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-champagne-dark"
          [attr.aria-label]="'Edit ' + group.title.toLowerCase()"
          (click)="createEventService.goTo(group.step)"
        >
          Edit
        </button>
      </header>

      <dl class="mt-2 divide-y divide-border">
        @for (row of group.rows; track row.label) {
          <div class="grid grid-cols-[8rem_1fr] gap-4 py-2.5 sm:grid-cols-[11rem_1fr]">
            <!-- <dt><app-text variant="tableCellMuted" [text]="row.label" /></dt> -->
            <!-- <dd class="whitespace-pre-line"><app-text variant="tableCell" [text]="row.value" /></dd> -->
          </div>
        }
      </dl>
    </section>
  }
</div>
