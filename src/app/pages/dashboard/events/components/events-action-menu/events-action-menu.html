<button
  type="button"
  class="grid size-9 place-items-center rounded-lg border border-border bg-surface text-text transition hover:bg-background"
  [attr.aria-label]="label()"
  [cdkMenuTriggerFor]="menu"
  [cdkMenuPosition]="positions"
>
  <app-icon name="ellipsis" [size]="16" />
</button>

<ng-template #menu>
  <div cdkMenu class="min-w-44 rounded-xl border border-border bg-surface p-1.5 shadow-lg">
    @for (item of items; track item.id) {
      <button
        type="button"
        cdkMenuItem
        class="flex w-full items-center gap-3 rounded-lg px-3 py-2 text-left transition hover:bg-background focus-visible:bg-background focus-visible:outline-none"
        [class]="item.danger ? 'text-rose' : 'text-text'"
        (cdkMenuItemTriggered)="action.emit(item.id)"
      >
        <app-icon [name]="item.icon" [size]="16" />
        <span class="font-body text-xs font-medium">{{ item.label }}</span>
      </button>
    }
  </div>
</ng-template>
