<app-section-card title="Quick Actions" icon="zap">
  <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
    @for (action of actions(); track action.id) {
      <button
        type="button"
        class="group relative rounded-xl border border-border bg-surface p-4 text-left transition hover:border-coral/40 hover:shadow-sm"
        (click)="selected.emit(action.id)"
      >
        <app-icon
          name="chevRight"
          [size]="14"
          className="absolute right-3 top-3 text-muted transition group-hover:text-coral"
        />
        <!-- <app-icon-bubble [icon]="action.icon" [tone]="action.tone" size="md" /> -->
        <app-text variant="listTitle" className="mt-3" [text]="action.title" />
        <app-text variant="listSubtitle" className="mt-1" [text]="action.description" />
      </button>
    }
  </div>
</app-section-card>
