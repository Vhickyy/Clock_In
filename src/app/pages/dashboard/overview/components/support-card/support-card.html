<section
  class="flex items-center gap-4 overflow-hidden rounded-2xl border border-coral/20 bg-linear-to-br from-coral-light to-surface p-5"
>
  <div
    class="grid h-28 w-16 shrink-0 place-items-center rounded-xl border-2 border-primary bg-surface text-primary"
  >
    <app-icon name="qrCode" [size]="30" />
  </div>
  <div>
    <app-text variant="sectionTitle" className="md:text-lg" text="Need help?" />
    <app-text
      variant="listSubtitle"
      className="mt-1"
      text="Our support team is here to help you make your event a success."
    />
    <button
      type="button"
      class="mt-3 inline-flex items-center gap-2 rounded-full bg-coral px-4 py-2 text-white transition hover:brightness-110"
      (click)="contact.emit()"
    >
      <app-text variant="buttonText" className="text-xs" text="Contact Support" />
      <app-icon name="arrowRight" [size]="14" />
    </button>
  </div>
</section>
